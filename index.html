<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.json"><title>Arsur Recipes</title>
<style>
:root{--bg:#0f1013;--card:#191b20;--card2:#21242b;--text:#f6f7f9;--muted:#9ca3af;--accent:#9be15d;--accent2:#54c9a3;--danger:#ff667a;--line:#2b2e36}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0d0e11,#121419);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif}button,input,textarea,select{font:inherit}button{border:0}.app{max-width:1050px;margin:auto;padding:18px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{font-size:25px;font-weight:850;letter-spacing:-.8px}.brand span{color:var(--accent)}.sub{color:var(--muted);font-size:13px;margin-top:3px}.add{width:46px;height:46px;border-radius:15px;background:var(--accent);color:#10130e;font-size:28px;font-weight:800;box-shadow:0 8px 30px #9be15d25}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:17px}.stat{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:13px}.stat b{font-size:19px}.stat small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.bar{height:5px;background:#30333a;border-radius:99px;margin-top:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}.tools{display:flex;gap:8px;overflow:auto;padding-bottom:3px;margin-bottom:17px}.chip{white-space:nowrap;padding:9px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:#cbd0d8}.chip.active{background:#dfffad;color:#10130e;border-color:transparent;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.recipe{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;position:relative;cursor:pointer}.photo{aspect-ratio:1/.9;background:linear-gradient(135deg,#252830,#17191e);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.heart{position:absolute;right:9px;top:9px;width:34px;height:34px;border-radius:12px;background:#111318bb;color:white;font-size:18px}.heart.on{color:#ff6175}.info{padding:12px}.name{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;gap:8px;color:var(--muted);font-size:11px;margin:5px 0 10px}.macros{display:flex;gap:6px;flex-wrap:wrap}.macro{font-size:10px;padding:5px 7px;border-radius:8px;background:var(--card2);color:#dce0e7}.p{color:var(--accent)}.empty{text-align:center;color:var(--muted);padding:55px 20px}.modal{position:fixed;inset:0;background:#000b;display:none;z-index:5;overflow:auto}.modal.show{display:block}.sheet{min-height:100%;background:#121419;max-width:700px;margin:auto;padding:18px 16px 35px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.close{background:var(--card2);color:white;width:40px;height:40px;border-radius:13px;font-size:22px}.form{display:grid;gap:12px}.field label{display:block;color:#c5cad2;font-size:12px;font-weight:700;margin:0 0 6px}.field input,.field textarea,.field select{width:100%;background:var(--card);border:1px solid var(--line);color:white;border-radius:13px;padding:12px;outline:none}.field textarea{min-height:110px;resize:vertical}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.save{width:100%;background:var(--accent);color:#10130e;padding:14px;border-radius:14px;font-weight:850;margin-top:6px}.delete{width:100%;background:#28171b;color:#ff8795;padding:12px;border-radius:14px;font-weight:700}.detailPhoto{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:20px;background:#20232a}.detail h1{font-size:30px;letter-spacing:-1px;margin:15px 0 7px}.pills{display:flex;gap:7px;flex-wrap:wrap}.pill{background:var(--card2);border-radius:10px;padding:8px 10px;font-size:12px}.section{margin-top:23px}.section h3{margin:0 0 10px}.ingredients{display:grid;gap:7px}.ingredient{background:var(--card);border:1px solid var(--line);padding:11px;border-radius:12px}.steps{white-space:pre-wrap;line-height:1.65;color:#d8dbe1}.video{display:block;text-align:center;background:#262a31;color:white;padding:13px;border-radius:13px;text-decoration:none;margin-top:10px}.footer{position:fixed;bottom:0;left:0;right:0;background:#101115eF;backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:10px max(16px,calc((100vw - 1050px)/2 + 16px));display:flex;justify-content:space-around}.nav{color:#8e949f;background:none;font-size:11px}.nav.active{color:var(--accent)}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.app{padding-top:28px}}
</style></head><body>
<div class="app"><header class="top"><div><div class="brand">ARSUR <span>RECIPES</span></div><div class="sub">Come bien. Entrena. Cumple tus macros.</div></div><button class="add" onclick="openEditor()">+</button></header>
<div class="stats"><div class="stat"><b id="todayK">0</b><small>kcal hoy / 2000</small><div class="bar"><i id="todayBar"></i></div></div><div class="stat"><b id="todayP">0g</b><small>proteína hoy / 180g</small><div class="bar"><i id="pBar"></i></div></div><div class="stat"><b id="count">0</b><small>recetas guardadas</small></div></div>
<div class="tools"><button class="chip active" data-filter="all">Todas</button><button class="chip" data-filter="favorite">❤️ Favoritas</button><button class="chip" data-filter="Desayuno">Desayuno</button><button class="chip" data-filter="Comida">Comida</button><button class="chip" data-filter="Cena">Cena</button><button class="chip" data-filter="Snack">Snack</button></div>
<main id="grid"></main></div>
<nav class="footer"><button class="nav active">🍽️<br>Recetas</button><button class="nav" onclick="openEditor()">＋<br>Añadir</button><button class="nav" onclick="showSearch()">⌕<br>Buscar</button></nav>
<div class="modal" id="editor"><div class="sheet"><div class="modalhead"><h2 id="editTitle">Nueva receta</h2><button class="close" onclick="closeModal('editor')">×</button></div><form class="form" onsubmit="saveRecipe(event)">
<input type="hidden" id="rid"><div class="field"><label>FOTO</label><input id="photo" type="file" accept="image/*"></div><div class="field"><label>NOMBRE</label><input id="name" required placeholder="Ej. Pollo teriyaki"></div>
<div class="twocol"><div class="field"><label>CATEGORÍA</label><select id="category"><option>Desayuno</option><option>Comida</option><option>Cena</option><option>Snack</option><option>Otro</option></select></div><div class="field"><label>TIEMPO (min)</label><input id="time" type="number" min="0" value="20"></div></div>
<div class="twocol"><div class="field"><label>CALORÍAS</label><input id="kcal" type="number" min="0" required></div><div class="field"><label>PROTEÍNA (g)</label><input id="protein" type="number" min="0" required></div></div>
<div class="twocol"><div class="field"><label>CARBOHIDRATOS (g)</label><input id="carbs" type="number" min="0" required></div><div class="field"><label>GRASAS (g)</label><input id="fat" type="number" min="0" required></div></div>
<div class="field"><label>INGREDIENTES — uno por línea</label><textarea id="ingredients" placeholder="200 g pollo&#10;100 g arroz&#10;20 ml salsa..."></textarea></div><div class="field"><label>PREPARACIÓN</label><textarea id="steps" placeholder="1. Cocina...&#10;2. Mezcla..."></textarea></div><div class="field"><label>LINK DE VÍDEO</label><input id="video" type="url" placeholder="https://youtube.com/..."></div>
<button class="save">Guardar receta</button><button type="button" class="delete" id="deleteBtn" style="display:none" onclick="deleteCurrent()">Eliminar receta</button></form></div></div>
<div class="modal" id="detail"><div class="sheet detail"><div class="modalhead"><span></span><button class="close" onclick="closeModal('detail')">×</button></div><div id="detailBody"></div></div></div>
<script>
let recipes=[],filter='all',db;
const req=indexedDB.open('arsur-recipes',1);req.onupgradeneeded=e=>e.target.result.createObjectStore('recipes',{keyPath:'id'});req.onsuccess=e=>{db=e.target.result;load()};
function tx(mode='readonly'){return db.transaction('recipes',mode).objectStore('recipes')}
function load(){const r=tx().getAll();r.onsuccess=()=>{recipes=r.result;render()}}
function put(x){const r=tx('readwrite').put(x);r.onsuccess=load}
function del(id){tx('readwrite').delete(id).onsuccess=load}
function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){let a=recipes.filter(r=>filter==='all'||(filter==='favorite'&&r.favorite)||(r.category===filter));document.getElementById('count').textContent=recipes.length;let g=document.getElementById('grid');g.innerHTML=a.length?a.map(card).join(''):'<div class="empty">Aún no tienes recetas aquí.<br><br>Pulsa <b>+</b> y crea la primera 🔥</div>';updateStats()}
function card(r){return '<article class="recipe" onclick="openDetail('+r.id+')"><div class="photo">'+(r.image?'<img src="'+r.image+'">':'🍽️')+'</div><button class="heart '+(r.favorite?'on':'')+'" onclick="event.stopPropagation();toggleFav('+r.id+')">'+(r.favorite?'♥':'♡')+'</button><div class="info"><div class="name">'+esc(r.name)+'</div><div class="meta"><span>⏱ '+r.time+' min</span><span>🔥 '+r.kcal+' kcal</span></div><div class="macros"><span class="macro p">P '+r.protein+'g</span><span class="macro">C '+r.carbs+'g</span><span class="macro">G '+r.fat+'g</span></div></div></article>'}
function updateStats(){let k=+localStorage.todayK||0,p=+localStorage.todayP||0;document.getElementById('todayK').textContent=k;document.getElementById('todayP').textContent=p+'g';document.getElementById('todayBar').style.width=Math.min(100,k/20)+'%';document.getElementById('pBar').style.width=Math.min(100,p/1.8)+'%'}
function openEditor(id=null){document.getElementById('editor').classList.add('show');document.getElementById('rid').value=id||'';document.getElementById('editTitle').textContent=id?'Editar receta':'Nueva receta';document.getElementById('deleteBtn').style.display=id?'block':'none';if(id){let r=recipes.find(x=>x.id===id);['name','category','time','kcal','protein','carbs','fat','ingredients','steps','video'].forEach(k=>document.getElementById(k).value=r[k]||'')}else{document.querySelector('#editor form').reset();document.getElementById('rid').value=''}}
function closeModal(id){document.getElementById(id).classList.remove('show')}
async function saveRecipe(e){e.preventDefault();let id=+document.getElementById('rid').value||Date.now(),old=recipes.find(x=>x.id===id);let image=old?.image||'';let f=document.getElementById('photo').files[0];if(f)image=await new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)});let x={id,image,name:v('name'),category:v('category'),time:+v('time')||0,kcal:+v('kcal')||0,protein:+v('protein')||0,carbs:+v('carbs')||0,fat:+v('fat')||0,ingredients:v('ingredients'),steps:v('steps'),video:v('video'),favorite:old?.favorite||false};put(x);closeModal('editor')}
function v(id){return document.getElementById(id).value.trim()}
function openDetail(id){let r=recipes.find(x=>x.id===id);document.getElementById('detailBody').innerHTML='<img class="detailPhoto" src="'+(r.image||'')+'" onerror="this.style.display=\'none\'"><h1>'+esc(r.name)+'</h1><div class="pills"><span class="pill">🔥 '+r.kcal+' kcal</span><span class="pill">🥩 '+r.protein+'g P</span><span class="pill">🍚 '+r.carbs+'g C</span><span class="pill">🥑 '+r.fat+'g G</span><span class="pill">⏱ '+r.time+' min</span></div><div class="section"><h3>Ingredientes</h3><div class="ingredients">'+(r.ingredients||'').split('\n').filter(Boolean).map(x=>'<div class="ingredient">☐ '+esc(x)+'</div>').join('')+'</div></div><div class="section"><h3>Preparación</h3><div class="steps">'+esc(r.steps||'Sin procedimiento añadido.')+'</div></div>'+(r.video?'<a class="video" href="'+esc(r.video)+'" target="_blank">▶ Ver vídeo de preparación</a>':'')+'<button class="save" style="margin-top:20px" onclick="closeModal(\'detail\');openEditor('+r.id+')">Editar receta</button>';document.getElementById('detail').classList.add('show')}
function toggleFav(id){let r=recipes.find(x=>x.id===id);r.favorite=!r.favorite;put(r)}
function deleteCurrent(){let id=+v('rid');if(id&&confirm('¿Eliminar esta receta?')){del(id);closeModal('editor')}}
function showSearch(){let q=prompt('¿Qué receta buscas?');if(q===null)return;let x=q.toLowerCase();document.querySelectorAll('.recipe').forEach(c=>c.style.display=c.innerText.toLowerCase().includes(x)?'':'none')}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});
window.addEventListener('storage',updateStats);
</script></body></html>
