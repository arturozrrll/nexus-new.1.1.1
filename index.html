<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.json"><title>Arsur Recipes</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0f1013;--card:#191b20;--card2:#21242b;--text:#f6f7f9;--muted:#9ca3af;--accent:#9be15d;--accent2:#54c9a3;--danger:#ff667a;--line:#2b2e36}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0d0e11,#121419);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif}button,input,textarea,select{font:inherit}button{border:0}.app{max-width:1050px;margin:auto;padding:18px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{font-size:25px;font-weight:850;letter-spacing:-.8px}.brand span{color:var(--accent)}.sub{color:var(--muted);font-size:13px;margin-top:3px}.add{width:46px;height:46px;border-radius:15px;background:var(--accent);color:#10130e;font-size:28px;font-weight:800;box-shadow:0 8px 30px #9be15d25}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:17px}.stat{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:13px}.stat b{font-size:19px}.stat small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.bar{height:5px;background:#30333a;border-radius:99px;margin-top:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}.tools{display:flex;gap:8px;overflow:auto;padding-bottom:3px;margin-bottom:17px}.chip{white-space:nowrap;padding:9px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:#cbd0d8}.chip.active{background:#dfffad;color:#10130e;border-color:transparent;font-weight:700}.grid{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:12px}.grid.list{grid-template-columns:1fr}.grid.list .recipe{display:grid;grid-template-columns:150px 1fr}.grid.list .photo{aspect-ratio:1}.grid.list .info{align-self:center}.viewtools{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:-7px 0 14px}.viewtools .group{display:flex;gap:6px;align-items:center}.viewtools label{color:var(--muted);font-size:11px}.viewtools select,.viewbtn{background:var(--card);border:1px solid var(--line);color:#cbd0d8;border-radius:10px;padding:8px 10px}.viewbtn.active{background:#dfffad;color:#10130e;font-weight:700}.recipe{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;position:relative;cursor:pointer}.photo{aspect-ratio:1/.9;background:linear-gradient(135deg,#252830,#17191e);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.heart{position:absolute;right:9px;top:9px;width:34px;height:34px;border-radius:12px;background:#111318bb;color:white;font-size:18px}.heart.on{color:#ff6175}.info{padding:12px}.name{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;gap:8px;color:var(--muted);font-size:11px;margin:5px 0 10px}.macros{display:flex;gap:6px;flex-wrap:wrap}.macro{font-size:10px;padding:5px 7px;border-radius:8px;background:var(--card2);color:#dce0e7}.p{color:var(--accent)}.empty{text-align:center;color:var(--muted);padding:55px 20px}.modal{position:fixed;inset:0;background:#000b;display:none;z-index:5;overflow:auto}.modal.show{display:block}.sheet{min-height:100%;background:#121419;max-width:700px;margin:auto;padding:18px 16px 35px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.close{background:var(--card2);color:white;width:40px;height:40px;border-radius:13px;font-size:22px}.form{display:grid;gap:12px}.field label{display:block;color:#c5cad2;font-size:12px;font-weight:700;margin:0 0 6px}.field input,.field textarea,.field select{width:100%;background:var(--card);border:1px solid var(--line);color:white;border-radius:13px;padding:12px;outline:none}.field textarea{min-height:110px;resize:vertical}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.save{width:100%;background:var(--accent);color:#10130e;padding:14px;border-radius:14px;font-weight:850;margin-top:6px}.delete{width:100%;background:#28171b;color:#ff8795;padding:12px;border-radius:14px;font-weight:700}.detailPhoto{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:20px;background:#20232a}.detail h1{font-size:30px;letter-spacing:-1px;margin:15px 0 7px}.pills{display:flex;gap:7px;flex-wrap:wrap}.pill{background:var(--card2);border-radius:10px;padding:8px 10px;font-size:12px}.section{margin-top:23px}.section h3{margin:0 0 10px}.ingredients{display:grid;gap:7px}.ingredient{background:var(--card);border:1px solid var(--line);padding:11px;border-radius:12px}.steps{white-space:pre-wrap;line-height:1.65;color:#d8dbe1}.video{display:block;text-align:center;background:#262a31;color:white;padding:13px;border-radius:13px;text-decoration:none;margin-top:10px}.footer{position:fixed;bottom:0;left:0;right:0;background:#101115eF;backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:10px max(16px,calc((100vw - 1050px)/2 + 16px));display:flex;justify-content:space-around}.nav{color:#8e949f;background:none;font-size:11px}.nav.active{color:var(--accent)}@media(min-width:700px){.app{padding-top:28px}.grid{gap:14px}.grid.list{grid-template-columns:1fr}.grid.list .recipe{grid-template-columns:190px 1fr}}@media(max-width:699px){.grid.list .name{font-size:14px}.grid.list .meta{flex-wrap:wrap}.grid.list .macros{flex-wrap:wrap}}
</style></head><body>
<div class="app"><header class="top"><div><div class="brand">ARSUR <span>RECIPES</span></div><div class="sub">Come bien. Entrena. Cumple tus macros.</div></div><div style="display:flex;gap:8px"><button id="accountBtn" class="chip" onclick="openAuth()">☁️ Entrar</button><button class="add" onclick="openEditor()">+</button></div></header>
<div class="stats"><div class="stat"><b id="todayK">0</b><small>kcal hoy / 2000</small><div class="bar"><i id="todayBar"></i></div></div><div class="stat"><b id="todayP">0g</b><small>proteína hoy / 180g</small><div class="bar"><i id="pBar"></i></div></div><div class="stat"><b id="count">0</b><small>recetas guardadas</small></div></div>
<div class="tools"><button class="chip active" data-filter="all">Todas</button><button class="chip" data-filter="favorite">❤️ Favoritas</button><button class="chip" data-filter="Desayuno">Desayuno</button><button class="chip" data-filter="Comida">Comida</button><button class="chip" data-filter="Cena">Cena</button><button class="chip" data-filter="Snack">Snack</button></div><div class="viewtools"><div class="group"><label>Mostrar</label><select id="colsSelect" onchange="setCols(this.value)"><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></div><div class="group"><button id="gridBtn" class="viewbtn active" onclick="setView('grid')">▦ Cuadrícula</button><button id="listBtn" class="viewbtn" onclick="setView('list')">☷ Lista</button></div><div class="group"><label>Orden</label><select id="sortSelect" onchange="setSort(this.value)"><option value="newest">Más nuevas</option><option value="oldest">Más antiguas</option><option value="name">Nombre</option><option value="kcal">Kcal</option><option value="protein">Proteína</option><option value="rating">Valoración</option></select></div></div>
<main id="grid"></main></div>
<nav class="footer"><button class="nav active">🍽️<br>Recetas</button><button class="nav" onclick="openEditor()">＋<br>Añadir</button><button class="nav" onclick="showSearch()">⌕<br>Buscar</button></nav>
<div class="modal" id="editor"><div class="sheet"><div class="modalhead"><h2 id="editTitle">Nueva receta</h2><button class="close" onclick="closeModal('editor')">×</button></div><form class="form" onsubmit="saveRecipe(event)">
<input type="hidden" id="rid"><div class="field"><label>FOTO</label><input id="photo" type="file" accept="image/*"></div><div class="field"><label>NOMBRE</label><input id="name" required placeholder="Ej. Pollo teriyaki"></div>
<div class="twocol"><div class="field"><label>CATEGORÍA</label><select id="category"><option>Desayuno</option><option>Comida</option><option>Cena</option><option>Snack</option><option>Otro</option></select></div><div class="field"><label>TIEMPO (min)</label><input id="time" type="number" min="0" value="20"></div></div>
<div class="twocol"><div class="field"><label>CALORÍAS</label><input id="kcal" type="number" min="0" required></div><div class="field"><label>PROTEÍNA (g)</label><input id="protein" type="number" min="0" required></div></div>
<div class="twocol"><div class="field"><label>CARBOHIDRATOS (g)</label><input id="carbs" type="number" min="0" required></div><div class="field"><label>GRASAS (g)</label><input id="fat" type="number" min="0" required></div></div>
<div class="field"><label>INGREDIENTES — uno por línea</label><textarea id="ingredients" placeholder="200 g pollo&#10;100 g arroz&#10;20 ml salsa..."></textarea></div><div class="field"><label>PREPARACIÓN</label><textarea id="steps" placeholder="1. Cocina...&#10;2. Mezcla..."></textarea></div><div class="field"><label>⭐ NOTAS (desayuno / comida / cena)<br><input id="ratingBreakfast" type="number" min="0" max="10" step="0.1" placeholder="Desayuno /10"><input id="ratingLunch" type="number" min="0" max="10" step="0.1" placeholder="Comida /10"><input id="ratingDinner" type="number" min="0" max="10" step="0.1" placeholder="Cena /10"><br>LINK DE VÍDEO</label><input id="video" type="url" placeholder="https://youtube.com/..."></div>
<button class="save">Guardar receta</button><button type="button" class="delete" id="deleteBtn" style="display:none" onclick="deleteCurrent()">Eliminar receta</button></form></div></div>

<div class="modal" id="auth"><div class="sheet"><div class="modalhead"><h2>☁️ Tu nube</h2><button class="close" onclick="closeModal('auth')">×</button></div>
<div id="authStatus" style="color:#9ca3af;margin-bottom:14px">Inicia sesión para sincronizar tus recetas entre iPhone y PC.</div>
<form class="form" onsubmit="authSubmit(event)">
<div class="field"><label>EMAIL</label><input id="authEmail" type="email" required autocomplete="email"></div>
<div class="field"><label>CONTRASEÑA</label><input id="authPassword" type="password" required minlength="6" autocomplete="current-password"></div>
<button class="save" id="authAction">Iniciar sesión</button>
<button type="button" class="chip" style="width:100%" onclick="toggleAuthMode()">Crear cuenta</button>
<button type="button" class="delete" id="logoutBtn" style="display:none" onclick="logout()">Cerrar sesión</button>
</form></div></div>
<div class="modal" id="detail"><div class="sheet detail"><div class="modalhead"><span></span><button class="close" onclick="closeModal('detail')">×</button></div><div id="detailBody"></div></div></div>
<script>
const SUPABASE_URL='https://ridnygpfifochnlmpjll.supabase.co';
const SUPABASE_KEY='sb_publishable_13JUrsyonn0G-LCFwKbaXg__9qxBKI0';
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let recipes=[],filter='all',db=null,currentUser=null,authMode='login',realtimeChannel=null;

const req=indexedDB.open('arsur-recipes',1);
req.onupgradeneeded=e=>e.target.result.createObjectStore('recipes',{keyPath:'id'});
req.onsuccess=e=>{db=e.target.result;initCloud()};

function tx(mode='readonly'){return db.transaction('recipes',mode).objectStore('recipes')}
function localLoad(){return new Promise(resolve=>{const r=tx().getAll();r.onsuccess=()=>resolve(r.result||[])})}
function localPut(x){return new Promise(resolve=>{const r=tx('readwrite').put(x);r.onsuccess=resolve})}
function localDel(id){return new Promise(resolve=>{tx('readwrite').delete(id).onsuccess=resolve})}
function esc(s=''){return String(s).replace(/[&<>\\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function v(id){return document.getElementById(id).value.trim()}
function closeModal(id){document.getElementById(id).classList.remove('show')}

async function initCloud(){
  const {data:{session}}=await supabaseClient.auth.getSession();
  currentUser=session?.user||null;
  updateAccountUI();
  if(currentUser) await syncFromCloud();
  else {recipes=await localLoad();render()}
  supabaseClient.auth.onAuthStateChange(async (_event,session)=>{
    currentUser=session?.user||null; updateAccountUI();
    if(currentUser) await syncFromCloud();
    else {recipes=await localLoad();render()}
  });
}
function updateAccountUI(){
  const b=document.getElementById('accountBtn'); if(!b)return;
  b.textContent=currentUser?'☁️ '+(currentUser.email?.split('@')[0]||'Cuenta'):'☁️ Entrar';
}
function openAuth(){
  document.getElementById('auth').classList.add('show');
  document.getElementById('logoutBtn').style.display=currentUser?'block':'none';
  document.getElementById('authAction').textContent=authMode==='login'?'Iniciar sesión':'Crear cuenta';
  document.getElementById('authStatus').textContent=currentUser?'Sincronización activa entre tus dispositivos.':'Inicia sesión para sincronizar tus recetas entre iPhone y PC.';
}
function toggleAuthMode(){
  authMode=authMode==='login'?'signup':'login';
  document.getElementById('authAction').textContent=authMode==='login'?'Iniciar sesión':'Crear cuenta';
  document.getElementById('authStatus').textContent=authMode==='login'?'Inicia sesión para sincronizar tus recetas entre tus dispositivos.':'Crea tu cuenta de ARSUR RECIPES. Después podrás usarla en iPhone y PC.';
}
async function authSubmit(e){
  e.preventDefault();
  const email=v('authEmail'),password=document.getElementById('authPassword').value;
  document.getElementById('authStatus').textContent='Conectando…';
  const result=authMode==='login'
    ? await supabaseClient.auth.signInWithPassword({email,password})
    : await supabaseClient.auth.signUp({email,password});
  if(result.error){document.getElementById('authStatus').textContent=result.error.message;return}
  if(authMode==='signup' && !result.data.session){
    document.getElementById('authStatus').textContent='Cuenta creada. Revisa tu email para confirmar la cuenta y después inicia sesión.';
  } else {closeModal('auth')}
}
async function logout(){
  await supabaseClient.auth.signOut();
  closeModal('auth');
}
async function syncFromCloud(){
  const {data,error}=await supabaseClient.from('recipes').select('*').order('created_at',{ascending:false});
  if(error){console.error(error);document.getElementById('authStatus').textContent='Error al cargar la nube: '+error.message;return}
  if(!data.length){
    const local=await localLoad();
    if(local.length){
      for(const r of local) await cloudUpsert(r);
      const again=await supabaseClient.from('recipes').select('*').order('created_at',{ascending:false});
      recipes=(again.data||[]).map(fromCloud);
    } else recipes=[];
  } else recipes=data.map(fromCloud);
  render();
  if(realtimeChannel) await supabaseClient.removeChannel(realtimeChannel);
  realtimeChannel=supabaseClient.channel('recipes-sync-'+currentUser.id)
    .on('postgres_changes',{event:'*',schema:'public',table:'recipes',filter:'user_id=eq.'+currentUser.id},payload=>handleRealtime(payload))
    .subscribe();
}
function fromCloud(r){
  return {id:r.id,image:r.image_path||'',name:r.name,category:r.category,time:r.time_minutes||0,kcal:+r.kcal||0,protein:+r.protein_g||0,carbs:+r.carbs_g||0,fat:+r.fat_g||0,ingredients:Array.isArray(r.ingredients)?r.ingredients.join('\n'):(r.ingredients||''),steps:r.steps||'',video:r.video_url||'',favorite:!!r.favorite,ratingBreakfast:r.rating_breakfast==null?null:+r.rating_breakfast,ratingLunch:r.rating_lunch==null?null:+r.rating_lunch,ratingDinner:r.rating_dinner==null?null:+r.rating_dinner,created_at:r.created_at||null};
}
function toCloud(r){
  return {id:r.id,user_id:currentUser.id,name:r.name,category:r.category||'Otro',time_minutes:+r.time||0,kcal:+r.kcal||0,protein_g:+r.protein||0,carbs_g:+r.carbs||0,fat_g:+r.fat||0,ingredients:(r.ingredients||'').split('\n').filter(Boolean),steps:r.steps||'',video_url:r.video||null,favorite:!!r.favorite,rating_breakfast:r.ratingBreakfast==null?null:+r.ratingBreakfast,rating_lunch:r.ratingLunch==null?null:+r.ratingLunch,rating_dinner:r.ratingDinner==null?null:+r.ratingDinner,image_path:r.image||null};
}
async function cloudUpsert(r){
  const {error}=await supabaseClient.from('recipes').upsert(toCloud(r),{onConflict:'id'});
  if(error) throw error;
}
async function saveCloudRecipe(r){
  let copy={...r};
  const file=document.getElementById('photo').files[0];
  if(file && currentUser){
    const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
    const path=currentUser.id+'/'+r.id+'.'+ext;
    const up=await supabaseClient.storage.from('recipe-images').upload(path,file,{upsert:true,contentType:file.type});
    if(up.error) throw up.error;
    copy.image=path;
  }
  if(currentUser) await cloudUpsert(copy); else await localPut(copy);
  return copy;
}
async function saveRecipe(e){
  e.preventDefault();
  let id=document.getElementById('rid').value||crypto.randomUUID();
  let old=recipes.find(x=>x.id===id);
  let x={id,image:old?.image||'',name:v('name'),category:v('category'),time:+v('time')||0,kcal:+v('kcal')||0,protein:+v('protein')||0,carbs:+v('carbs')||0,fat:+v('fat')||0,ingredients:v('ingredients'),steps:v('steps'),video:v('video'),favorite:old?.favorite||false,ratingBreakfast:+v('ratingBreakfast')||null,ratingLunch:+v('ratingLunch')||null,ratingDinner:+v('ratingDinner')||null};
  try{await saveCloudRecipe(x);if(currentUser){const c=await supabaseClient.from('recipes').select('*').eq('id',id).single();if(c.data)x=fromCloud(c.data)};recipes=[...recipes.filter(r=>r.id!==id),x];render();closeModal('editor')}
  catch(err){alert('No se pudo guardar: '+err.message)}
}
function render(){
  let a=recipes.filter(r=>filter==='all'||(filter==='favorite'&&r.favorite)||(r.category===filter));
  a=[...a].sort((x,y)=>sortRecipes(x,y));
  document.getElementById('count').textContent=recipes.length;
  let g=document.getElementById('grid');
  g.innerHTML=a.length?a.map(card).join(''):'<div class="empty">Aún no tienes recetas aquí.<br><br>Pulsa <b>+</b> y crea la primera 🔥</div>';
  hydrateImages();
  updateStats();
  g.style.setProperty('--cols',viewMode==='grid'?cols:1); g.classList.toggle('list',viewMode==='list');
}
let cols=+(localStorage.arsurCols||4); if(![3,4,5].includes(cols))cols=4;
let viewMode=localStorage.arsurView||'grid'; let sortMode=localStorage.arsurSort||'newest';
function sortRecipes(a,b){if(sortMode==='oldest')return new Date(a.created_at||0)-new Date(b.created_at||0);if(sortMode==='name')return a.name.localeCompare(b.name,'es');if(sortMode==='kcal')return (+a.kcal||0)-(+b.kcal||0);if(sortMode==='protein')return (+b.protein||0)-(+a.protein||0);if(sortMode==='rating'){const ra=[a.ratingBreakfast,a.ratingLunch,a.ratingDinner].filter(x=>x!=null);const rb=[b.ratingBreakfast,b.ratingLunch,b.ratingDinner].filter(x=>x!=null);return (rb.length?rb.reduce((x,y)=>x+y,0)/rb.length:0)-(ra.length?ra.reduce((x,y)=>x+y,0)/ra.length:0)}return new Date(b.created_at||0)-new Date(a.created_at||0)}
function setCols(v){cols=+v;localStorage.arsurCols=cols;render()}
function setView(v){viewMode=v;localStorage.arsurView=v;render();document.getElementById('gridBtn').classList.toggle('active',v==='grid');document.getElementById('listBtn').classList.toggle('active',v==='list')}
function setSort(v){sortMode=v;localStorage.arsurSort=v;render()}
function initDisplayControls(){document.getElementById('colsSelect').value=String(cols);document.getElementById('sortSelect').value=sortMode;document.getElementById('gridBtn').classList.toggle('active',viewMode==='grid');document.getElementById('listBtn').classList.toggle('active',viewMode==='list')}
function card(r){
  let ratings=[r.ratingBreakfast,r.ratingLunch,r.ratingDinner].filter(x=>x!=null);
  let ratingHtml=ratings.length?'<div style="margin-top:8px;font-size:11px">⭐ '+(ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1)+'/10</div>':'';
  let img=r.image?(r.image.startsWith('data:')?r.image:null):null;
  return '<article class="recipe" onclick="openDetail(\''+r.id+'\')"><div class="photo" data-img="'+esc(r.image||'')+'">'+(img?'<img src="'+img+'">':(r.image?'📷':'🍽️'))+'</div><button class="heart '+(r.favorite?'on':'')+'" onclick="event.stopPropagation();toggleFav(\''+r.id+'\')">'+(r.favorite?'♥':'♡')+'</button><div class="info"><div class="name">'+esc(r.name)+'</div><div class="meta"><span>⏱ '+r.time+' min</span><span>🔥 '+r.kcal+' kcal</span></div><div class="macros"><span class="macro p">P '+r.protein+'g</span><span class="macro">C '+r.carbs+'g</span><span class="macro">G '+r.fat+'g</span></div>'+ratingHtml+'</div></article>';
}
async function hydrateImages(){
  for(const el of document.querySelectorAll('.photo[data-img]')){
    const path=el.dataset.img;
    if(!path||path.startsWith('data:'))continue;
    const {data,error}=await supabaseClient.storage.from('recipe-images').createSignedUrl(path,3600);
    if(!error&&data?.signedUrl)el.innerHTML='<img src="'+data.signedUrl+'">';
  }
}
function updateStats(){let k=+localStorage.todayK||0,p=+localStorage.todayP||0;document.getElementById('todayK').textContent=k;document.getElementById('todayP').textContent=p+'g';document.getElementById('todayBar').style.width=Math.min(100,k/20)+'%';document.getElementById('pBar').style.width=Math.min(100,p/1.8)+'%';}
function openEditor(id=null){
  document.getElementById('editor').classList.add('show');document.getElementById('rid').value=id||'';document.getElementById('editTitle').textContent=id?'Editar receta':'Nueva receta';document.getElementById('deleteBtn').style.display=id?'block':'none';
  if(id){let r=recipes.find(x=>x.id===id);['name','category','time','kcal','protein','carbs','fat','ingredients','steps','video','ratingBreakfast','ratingLunch','ratingDinner'].forEach(k=>document.getElementById(k).value=r[k]??'')}
  else{document.querySelector('#editor form').reset();document.getElementById('rid').value=''}
}
function openDetail(id){
  let r=recipes.find(x=>x.id===id);if(!r)return;
  let ratings='<div class="section"><h3>⭐ Valoraciones</h3><div class="pills">'+(r.ratingBreakfast!=null?'<span class="pill">🌅 Desayuno '+r.ratingBreakfast+'/10</span>':'')+(r.ratingLunch!=null?'<span class="pill">☀️ Comida '+r.ratingLunch+'/10</span>':'')+(r.ratingDinner!=null?'<span class="pill">🌙 Cena '+r.ratingDinner+'/10</span>':'')+'</div></div>';
  document.getElementById('detailBody').innerHTML='<div class="photo" id="detailPhoto" style="border-radius:20px;aspect-ratio:16/10">🍽️</div><h1>'+esc(r.name)+'</h1><div class="pills"><span class="pill">🔥 '+r.kcal+' kcal</span><span class="pill">🥩 '+r.protein+'g P</span><span class="pill">🍚 '+r.carbs+'g C</span><span class="pill">🥑 '+r.fat+'g G</span><span class="pill">⏱ '+r.time+' min</span></div>'+ratings+'<div class="section"><h3>Ingredientes</h3><div class="ingredients">'+(r.ingredients||'').split('\n').filter(Boolean).map(x=>'<div class="ingredient">☐ '+esc(x)+'</div>').join('')+'</div></div><div class="section"><h3>Preparación</h3><div class="steps">'+esc(r.steps||'Sin procedimiento añadido.')+'</div></div>'+(r.video?'<a class="video" href="'+esc(r.video)+'" target="_blank">▶ Ver vídeo de preparación</a>':'')+'<button class="save" style="margin-top:20px" onclick="closeModal(\'detail\');openEditor(\''+r.id+'\')">Editar receta</button>';
  document.getElementById('detail').classList.add('show');
  if(r.image&&!r.image.startsWith('data:'))supabaseClient.storage.from('recipe-images').createSignedUrl(r.image,3600).then(({data})=>{if(data?.signedUrl)document.getElementById('detailPhoto').innerHTML='<img class="detailPhoto" src="'+data.signedUrl+'">';});
  else if(r.image)document.getElementById('detailPhoto').innerHTML='<img class="detailPhoto" src="'+r.image+'">';
}
async function toggleFav(id){
  let r=recipes.find(x=>x.id===id);if(!r)return;r.favorite=!r.favorite;
  try{if(currentUser)await cloudUpsert(r);else await localPut(r);render()}catch(e){alert('No se pudo actualizar: '+e.message)}
}
async function deleteCurrent(){
  let id=v('rid');if(!id||!confirm('¿Eliminar esta receta?'))return;
  try{
    if(currentUser){
      const r=recipes.find(x=>x.id===id);
      if(r?.image)await supabaseClient.storage.from('recipe-images').remove([r.image]);
      const {error}=await supabaseClient.from('recipes').delete().eq('id',id);if(error)throw error;
    }else await localDel(id);
    recipes=recipes.filter(r=>r.id!==id);render();closeModal('editor');
  }catch(e){alert('No se pudo eliminar: '+e.message)}
}
function handleRealtime(payload){
  if(payload.eventType==='DELETE'){recipes=recipes.filter(r=>r.id!==payload.old.id)}
  else {const x=fromCloud(payload.new);recipes=[...recipes.filter(r=>r.id!==x.id),x]}
  render();
}
function showSearch(){let q=prompt('¿Qué receta buscas?');if(q===null)return;let x=q.toLowerCase();document.querySelectorAll('.recipe').forEach(c=>c.style.display=c.innerText.toLowerCase().includes(x)?'':'none')}
document.querySelectorAll('.chip').forEach(b=>{if(b.dataset.filter)b.onclick=()=>{document.querySelectorAll('.chip[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()}});
initDisplayControls(); window.addEventListener('storage',updateStats);
</script></body></html>
